<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<title>ARS Agent 웹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  ARS Agent 웹 클라이언트.
  Android 앱의 동작을 웹으로 옮긴 화면.
  Android 앱 대비 주요 변경: 진행 상태 음성 안내 생략, 번호 입력 시 DTMF 신호음.
  같은 서버(/v1)에 연결. 세션 토큰·민감정보 입력값 저장 없음 (API 키는 이 브라우저 저장소에만 보관).
  Preact + htm (MIT License) 파일 내 포함.
-->
<style>
:root{
  --blue:#007AFF;--green:#34C759;--red:#FF3B30;--ink:#1C1C1E;--secondary:#636366;--neutral:#F2F2F7;--border:#D1D1D6;
  --grad:linear-gradient(180deg,#FFF1E8 0%,#E9E6FA 32%,#DDF4EE 62%,#F2F2F7 100%);
  --noto:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --batang:"Gowun Batang","Noto Serif KR","AppleMyungjo",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E5E5EA;color:var(--ink);font-family:var(--noto);font-size:15px;line-height:23px;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{display:flex;align-items:center;justify-content:center}
#root{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
/* Typography is shared by every screen; keypad digits and phone numbers retain their own scale. */
.app{--safe-top:env(safe-area-inset-top,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);--text-scale:1;--font-body:calc(15px * var(--text-scale));--line-body:calc(23px * var(--text-scale));--font-small:calc(13px * var(--text-scale));--line-small:calc(20px * var(--text-scale));--font-action:calc(14px * var(--text-scale));--line-action:calc(20px * var(--text-scale));position:relative;width:100%;max-width:430px;height:100%;height:100dvh;overflow:hidden;background:var(--grad);display:flex;flex-direction:column;font-size:var(--font-body);line-height:var(--line-body)}
.app.large-text{--text-scale:1.25}
.app-viewport{position:relative;flex:1;min-height:0;width:100%;display:flex;flex-direction:column}
.app-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;min-height:48px;padding:calc(4px + var(--safe-top)) max(12px,var(--safe-right)) 4px max(12px,var(--safe-left));background:transparent}
.toolbar-info{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0;flex:1}
.toolbar-mode{font-size:var(--font-small);line-height:var(--line-small);font-weight:500;color:var(--secondary);white-space:nowrap}
.text-size-toggle{margin-left:auto;flex:none;min-height:44px;padding:8px 12px;border-radius:12px;background:rgba(0,122,255,.08);color:var(--blue);font-family:var(--noto);font-weight:700;font-size:calc(16px * var(--text-scale));line-height:24px}
.text-size-toggle:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (min-width:600px) and (min-height:700px){.app{height:min(100dvh,900px);border-radius:28px;box-shadow:0 12px 48px rgba(0,0,0,.18)}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
button:disabled{cursor:default}
textarea,input{font:inherit;color:inherit}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app-viewport .screen{padding-top:0}
.screen.white{background:#fff}
.screen.grad{background:transparent}
.app.white-top{background:#fff}
.col{display:flex;flex-direction:column}
.row{display:flex;flex-direction:row}
.grow{flex:1 1 0;min-height:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.center{align-items:center}
.t-title{font-family:var(--noto);font-weight:700;font-size:calc(20px * var(--text-scale));line-height:calc(28px * var(--text-scale))}
.t-headline{font-family:var(--noto);font-weight:700;font-size:calc(28px * var(--text-scale));line-height:calc(38px * var(--text-scale))}
.call-number{font-size:28px;line-height:38px}
.confirm-number{font-size:20px;line-height:28px}
.call-header-tight{flex-direction:row;flex-wrap:wrap;justify-content:center}
.call-institution{flex-basis:100%;width:100%;overflow-wrap:anywhere}
.call-frame{padding:0 20px}
.large-text .agent-call .call-frame{padding:0 12px}
.large-text .agent-call .card{padding:12px}
.t-body{font-size:var(--font-body);line-height:var(--line-body)}
.t-bodym{font-family:var(--noto);font-size:var(--font-small);line-height:var(--line-small)}
.t-label{font-family:var(--noto);font-weight:500;font-size:var(--font-small);line-height:calc(18px * var(--text-scale))}
.t-17{font-size:calc(17px * var(--text-scale));line-height:calc(28px * var(--text-scale))}
.sec{color:var(--secondary)}.blue{color:var(--blue)}.red{color:var(--red)}
.tc{text-align:center}
.pre{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.icon{display:inline-flex;flex:none}.icon svg{width:100%!important;height:100%!important;display:block}
/* 버튼 */
.tbtn{color:var(--blue);font-family:var(--noto);font-weight:500;font-size:var(--font-action);line-height:var(--line-action);min-height:calc(40px * var(--text-scale));padding:10px 12px;border-radius:20px;align-self:flex-start;text-align:center}
.tbtn:disabled{color:rgba(28,28,30,.38)}
.tbtn:active:not(:disabled){background:rgba(0,122,255,.08)}
.tbtn.c{align-self:center}
.fbtn{background:var(--blue);color:#fff;font-family:var(--noto);font-weight:500;font-size:var(--font-action);line-height:var(--line-action);min-height:calc(40px * var(--text-scale));padding:10px 24px;border-radius:20px;align-self:flex-start}
.fbtn:disabled{background:rgba(28,28,30,.12);color:rgba(28,28,30,.38)}
.fbtn.wide{width:100%;min-height:48px;border-radius:16px;align-self:stretch}
.obtn{border:1px solid var(--border);border-radius:16px;min-height:52px;width:100%;color:var(--blue);font-family:var(--noto);font-weight:500;font-size:var(--font-action);line-height:var(--line-action)}
/* 원형 동작 버튼 */
.ra{width:96px;display:flex;flex-direction:column;align-items:center;padding:2px 0;border-radius:12px;flex:none}
.ra.w{flex:1 1 0;width:auto;min-width:0}
.ra:disabled{opacity:.38}
.ra .round{border-radius:50%;display:flex;align-items:center;justify-content:center}
.ra .t-label{margin-top:8px;text-align:center;word-break:keep-all}
.ra:active:not(:disabled) .round{filter:brightness(.93)}
.agent-controls{max-width:304px;width:100%;min-height:88px;gap:8px;justify-content:center;flex:none}
/* Reserve a one-line center caption. The left two-line caption uses its own column beside End. */
.agent-controls.close-to-end{height:96px;min-height:96px;align-items:flex-start}
.agent-controls.with-handoff{max-width:352px;gap:4px;align-items:flex-start}
.agent-controls.with-handoff.close-to-end{height:auto;min-height:96px}
.agent-controls.with-handoff .t-label{overflow-wrap:anywhere}
/* 키패드 */
.keypad{width:100%;max-width:280px;display:flex;flex-direction:column}
.keypad-row{display:flex;justify-content:space-between}
.key{position:relative;width:72px;height:72px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.key.compact{background:rgba(255,255,255,.76);box-shadow:none}
/* A fine glass rim; the key face, label contrast and hit area stay unchanged. */
.key::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:rgba(136,168,183,.2);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude}
.key::after{content:"";position:absolute;inset:1.5px;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4)}
.key:active:not(:disabled){filter:brightness(.9)}
.app.anon .key:active:not(:disabled){filter:none}
.app.anon .key:focus-visible{outline:none}
.key-digit{font-family:system-ui,-apple-system,"Roboto",sans-serif;font-size:32px;line-height:36px}
.key-letters{font-size:10px;line-height:12px;min-height:12px}
/* Reference phone dialer: keep these proportions separate from in-call input. */
.keypad-home{--dial-key-size:clamp(64px,19.4vw,80px)}
.dialer .keypad{max-width:calc(var(--dial-key-size) * 3 + 48px)}
.dialer .key{width:var(--dial-key-size);height:var(--dial-key-size);background:#FDFDFD;box-shadow:0 6px 22px rgba(0,0,0,.065)}
.dialer .key::before{padding:1px;background:rgba(255,255,255,.95)}
.dialer .key::after{inset:1px}
.dialer .key-digit{font-size:36px;line-height:40px;font-weight:400}
.dialer .key-letters{font-family:system-ui,-apple-system,"Roboto",sans-serif;font-size:10px;line-height:12px;font-weight:700;letter-spacing:2px;padding-left:2px}
.dialer .key[aria-label="키 0"] .key-letters{font-size:16px;letter-spacing:0;padding-left:0}
.dialer-call-actions .ra{width:116px}
.dialer-call-actions .round{width:var(--dial-key-size)!important;height:var(--dial-key-size)!important}
.keypad-home .tabs{margin-top:24px;margin-bottom:8px;box-shadow:0 5px 24px rgba(0,0,0,.065)}
.keypad-home .tab{justify-content:center}
.keypad-home .tab.on{background:#EDEDED;color:var(--blue)}
.keypad-home .tab .t-label{margin-top:2px}
.keypad-home .tab .icon{width:28px!important;height:28px!important}
.keypad-home .tab:nth-child(1) svg path:first-child,.keypad-home .tab:nth-child(2) svg path:first-child{fill:currentColor}
.keypad-home .tab:nth-child(1) svg path:nth-child(2){stroke:#fff}
.keypad-home .tab:nth-child(2) svg path:not(:first-child){fill:#fff}
.keypad-home .tab:nth-child(3) svg path{stroke:currentColor;stroke-width:1.5px}
/* 카드 */
.card{background:#fff;border-radius:20px;box-shadow:0 1px 3px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.06);padding:16px;display:flex;flex-direction:column;gap:8px;font-family:var(--batang);width:100%}
.card.needs-response{outline:2px solid rgba(0,122,255,.24);outline-offset:-2px}
.task-cue{align-self:flex-start;font-family:var(--noto);font-size:var(--font-small);line-height:var(--line-small);font-weight:500;padding:3px 10px;border-radius:8px;color:var(--secondary);background:var(--neutral);flex:none}
.task-cue.response{color:#005CC8;background:rgba(0,122,255,.08)}
.card .bm{font-family:var(--batang);font-size:var(--font-small);line-height:var(--line-small)}
.card .t-label.blue{color:#005CC8}
.choice-options{display:flex;flex-direction:column;gap:10px;flex:none;width:100%}
.option{display:flex;align-items:center;flex:none;width:100%;min-height:calc(56px * var(--text-scale));background:var(--neutral);border:1px solid #E0E2EA;border-radius:12px;padding:12px 14px;text-align:left;gap:12px;scroll-margin-block:12px}
.option:active:not(:disabled){background:rgba(0,122,255,.10)}
.option:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.option .t-bodym{flex:1;min-width:0;overflow-wrap:anywhere;font-size:calc(16px * var(--text-scale));line-height:calc(24px * var(--text-scale));font-weight:500}
.option .t-bodym.blue{flex:none;min-width:40px;padding:2px 8px;border-radius:8px;text-align:center;color:#005CC8;background:rgba(0,122,255,.08);font-weight:700}
.option:disabled{border-color:transparent;pointer-events:none}
.option:disabled .t-bodym{color:var(--secondary)}
.option:disabled .t-bodym.blue{background:#E5E5EA}
.progress-details,.caption-details{display:flex;flex-direction:column;gap:8px;flex:none;width:100%;min-width:0}
.caption-details{display:grid;grid-template-columns:minmax(0,1fr) auto}
.caption-details > .t-label{grid-column:1;grid-row:1;align-self:center}
.caption-details > .ars-caption{grid-column:1 / -1;grid-row:2}
.recent-menu + .caption-details{margin-top:calc(12px * var(--text-scale))}
.disclosure-toggle{display:flex;align-items:center;gap:8px;min-height:44px;width:100%;padding:8px 12px;border-radius:10px;text-align:left;background:var(--neutral);color:#005CC8;font-family:var(--noto);font-size:var(--font-action);line-height:var(--line-action);font-weight:500;cursor:pointer;list-style:none}
.disclosure-toggle::-webkit-details-marker{display:none}
.disclosure-toggle:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.disclosure-toggle span[aria-hidden]{width:16px;flex:none;text-align:center}
.caption-toggle{grid-column:1 / -1;grid-row:3;justify-self:start;width:auto;min-width:44px;align-self:start;gap:4px;padding:0;margin-top:-4px;border-radius:6px;background:transparent}
.caption-toggle[aria-expanded="true"]{grid-column:2;grid-row:1;justify-self:end;align-self:center;margin-top:0}
.caption-toggle span[aria-hidden]{display:flex;align-items:center;justify-content:center}
.caption-toggle:hover span:not([aria-hidden]){text-decoration:underline;text-underline-offset:3px}
.path-history{list-style:none;display:flex;flex-direction:column;gap:8px;margin:8px 0 0;padding:0}
.path-history li{border-left:2px solid rgba(0,122,255,.18);padding-left:12px}
.ars-caption{flex:none;width:100%}
.ars-caption.preview{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
/* 음성 입력 */
.vin{display:flex;align-items:center;width:100%;min-height:64px;background:var(--neutral);border:1px solid var(--border);border-radius:16px;padding:8px 14px;gap:8px}
.vin textarea{flex:1;border:0;background:transparent;outline:none;resize:none;font-family:var(--noto);font-size:var(--font-body);line-height:var(--line-body);color:var(--ink);padding:0;min-height:23px;max-height:160px}
.vin textarea::placeholder,.vin .goal-text::placeholder{color:var(--secondary)}
.vin .goal-text{flex:1;border:0;background:transparent;outline:none;font-family:var(--noto);font-size:var(--font-body);line-height:var(--line-body);color:var(--ink);padding:0;min-width:0}
.vin .mic{width:48px;height:48px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
/* 대화상자 */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.dialog{background:#F7F2FA;border-radius:28px;padding:24px;width:100%;max-width:312px;max-height:90%;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.dialog h2{margin:0;font-family:var(--noto);font-weight:400;font-size:calc(24px * var(--text-scale));line-height:calc(32px * var(--text-scale))}
.dialog .dtext{font-family:var(--noto);font-size:var(--font-action);line-height:var(--line-action);color:#49454F;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.dialog .dtext > .field:first-child{margin-top:10px}
.dialog .dbtns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;flex:none}
.field{position:relative;border:1px solid #79747E;border-radius:4px;padding:16px 12px 8px}
.field label{position:absolute;top:-9px;left:10px;background:#F7F2FA;padding:0 4px;font-size:calc(12px * var(--text-scale));line-height:calc(16px * var(--text-scale));color:var(--blue)}
.field input{border:0;outline:none;background:transparent;width:100%;font-size:calc(16px * var(--text-scale));line-height:calc(24px * var(--text-scale))}
.field select{border:0;outline:none;background:transparent;width:100%;font-size:calc(16px * var(--text-scale));line-height:calc(24px * var(--text-scale));padding:2px 0}
/* 오디오 팝오버 */
.pop-scrim{position:absolute;inset:0;background:rgba(28,28,30,.12);z-index:30}
.pop{position:absolute;right:20px;bottom:240px;width:224px;background:#fff;border-radius:18px;border:1px solid rgba(209,209,214,.5);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px;z-index:31}
.pop button{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 8px;font-weight:500}
.pop button:disabled{opacity:.38}
/* 탭 */
.tabs{display:flex;flex:none;min-height:calc(60px * var(--text-scale));background:#fff;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.14);padding:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;border-radius:999px;padding:5px 0}
.tab.on{background:var(--neutral)}
.search{display:flex;align-items:center;gap:8px;background:var(--neutral);border-radius:12px;padding:12px}
.search input{flex:1;border:0;outline:none;background:transparent;font-size:var(--font-body);line-height:var(--line-body)}
.contact{display:flex;align-items:center;width:100%;padding:16px 0;border-bottom:1px solid var(--neutral);text-align:left;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--neutral);display:flex;align-items:center;justify-content:center;flex:none}
.box{background:var(--neutral);border-radius:12px;padding:16px;width:100%}
.top-label{position:absolute;top:8px;left:0;right:0;text-align:center;pointer-events:none}
.presence{align-self:flex-start;font-size:12px;line-height:18px;padding:1px 8px;border-radius:10px;background:rgba(0,0,0,.06);color:var(--secondary)}
.presence.multi{color:var(--red);background:rgba(255,59,48,.10)}
/* 듣기 표시 점 */
.dots span{color:transparent}
.dots.on span{animation:dot 2s linear infinite}
.dots.on span:nth-child(1){animation-name:dot1}.dots.on span:nth-child(2){animation-name:dot2}.dots.on span:nth-child(3){animation-name:dot3}
@keyframes dot1{0%,24.99%{color:transparent}25%,100%{color:var(--ink)}}
@keyframes dot2{0%,49.99%{color:transparent}50%,100%{color:var(--ink)}}
@keyframes dot3{0%,74.99%{color:transparent}75%,100%{color:var(--ink)}}
.mask{font-size:24px;line-height:32px;flex:1;text-align:center;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;letter-spacing:2px}
/* Keep secure input controls together; only their spacing and size respond to height. */
.secure-call{--secure-end-height:104px;--secure-bottom:8px;--secure-top:28px;--secure-gap:8px}
.secure-call .call-frame{gap:var(--secure-gap)}
.secure-call-body{display:flex;flex-direction:column;align-items:center;gap:var(--secure-gap);width:100%;flex:1;min-height:0;padding-top:var(--secure-top)}
.secure-header{width:100%;flex:none}
.secure-input-panel{width:100%;display:flex;flex-direction:column;align-items:center;gap:var(--secure-gap);flex:1;min-height:0}
.secure-copy{width:100%;flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:center;display:flex;flex-direction:column;gap:6px}
.secure-copy > *{flex:none}
.secure-description{font-size:var(--font-small);line-height:var(--line-small);overflow-wrap:anywhere}
.secure-description span{display:block}
.secure-count{display:flex;align-items:center;min-height:26px;flex:none;width:100%}
.secure-count .mask{font-size:20px;line-height:26px}
.secure-input-panel .keypad{gap:8px!important;flex:1;min-height:200px;max-height:312px;margin-block:auto}
.secure-input-panel .keypad-row{flex:1;min-height:44px;max-height:72px;align-items:center}
.secure-input-panel .key{width:auto;height:100%;aspect-ratio:1;min-width:44px;min-height:44px;max-width:72px;max-height:72px}
.secure-input-panel .key-letters{flex:none}
.secure-call .secure-submit{flex:none}
.large-text .secure-call{--secure-top:12px}
.secure-call-short{--secure-end-height:86px;--secure-bottom:2px;--secure-top:20px;--secure-gap:4px}
.large-text .secure-call-short{--secure-top:0px}
.secure-call-short .secure-header > div{gap:2px 8px!important}
.secure-call-short .call-number{font-size:24px;line-height:32px}
.secure-call-short .secure-copy{gap:4px}
.secure-call-short .secure-input-panel .keypad{gap:4px!important;min-height:188px}
.secure-call-short .secure-input-panel .key-digit{font-size:26px;line-height:30px}
.secure-call-short .secure-input-panel .key-letters{font-size:9px;line-height:10px;min-height:10px}
.secure-call-short .secure-submit{min-height:44px;padding:8px 16px}
.secure-call-short .ra{padding:0}
.secure-call-short .ra .t-label{margin-top:4px}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
"use strict";

/* ------------------------------------------------------------------ VoiceSessionRelay */
class VoiceSessionRelay {
  constructor() { this.current = null; this.observer = null; }
  observe(cb) { this.observer = cb; cb?.(this.current); }
  decorate(delegate) {
    const relay = this;
    let owned = null;
    return {
      health: () => delegate.health(),
      create: async (phone, goal, record, combo = null, agent = false) => { const c = await delegate.create(phone, goal, record, combo, agent); owned = c; relay.current = c; relay.observer?.(c); return c; },
      recording: (s) => delegate.recording(s),
      deleteRecording: (s) => delegate.deleteRecording(s),
      events: (s, h) => delegate.events(s, h),
      act: (s, a) => delegate.act(s, a),
      result: (s) => delegate.result(s),
      close: () => { if (owned != null && relay.current === owned) { relay.current = null; relay.observer?.(null); } owned = null; delegate.close(); },
    };
  }
}

/* ------------------------------------------------------------------ LiveCallOwner */
const monotonicSeconds = () => Math.floor(performance.now() / 1000);

      // 같은 요청에 답하거나 다시 취소할 수 있게 함. 보내는 동안의 중복은 busy 로 차단

  returnAfterEnd() {
    const s = this.server.state;
    if (this.closed || !s.hasSession || isActive(s) || s.busy || s.starting || s.creationUncertain) return false;

  }

/** 마우스·키보드 환경 여부. 목적 입력 방식 구분에 사용 */
const DESKTOP_QUERY = "(hover: hover) and (pointer: fine)";
function useDesktop() {

}
/** 마우스·키보드 환경 전용 목적 입력: 글자 입력 후 Enter 또는 '발신 확인'으로 확인 창 열기 */
function GoalTextInput({ value, onValue, onSubmit }) {

    <input ref=${ref} type="text" class="goal-text" placeholder="원하는 일을 입력해 주세요" aria-label="목적 입력" maxlength="500" enterkeyhint="go"
      onInput=${(e) => onValue(e.target.value)} onKeyDown=${(e) => { if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); onSubmit(); } }}/>
  </div>`;
}
function LivePurposeScreen({ entry, server, voice }) {
  const desktop = useDesktop();

    // 휴대폰: 말하기 결과가 한 번에 들어오므로 1.2초 뒤 확인 창 열기 (앱과 같음)
    // 마우스·키보드 환경: 타자 중간에 창이 뜨지 않도록 Enter 또는 '발신 확인'으로만 열기
    if (desktop) return;
    const goal = entry.goal.trim();
    if (!goal || goal === prepared.current) return;
    const t = setTimeout(() => { prepared.current = goal; voice?.cancelInput?.(); owner.prepare(); }, 1200); // 동의 대화상자만 열기. 세션 생성 없음
    return () => clearTimeout(t);

    // must not restart playback on subsequent server updates.
    else if (visible.current && session && !["idle", "dialing"].includes(state.snapshot.status) && autoPlayedSession.current !== session.sessionId) {
      autoPlayedSession.current = session.sessionId;
      player.start(session);
    }
  });
  // 긴 음성 안내·인식 중 기한이 지나면 결과만 거르지 않고 입력 자체 중단
  const pend = state.snapshot.pendingRequest;
  useEffect(() => {
    const t = pend ? parseInstant(pend.expiresAt) : null;
    if (t == null || t - Date.now() <= 0) return;
    const h = later(t - Date.now(), () => voice.cancelInput());
    return () => clearTimeout(h);
  }, [jsonKey(pend), canSendOf(state)]);
  const ui = {
    status, arsEnabled: audio.enabled, arsPlaying: audio.playing, arsError: audio.error,
    toggleVoice: () => { if (status.enabled) { activation.cancel(); voice.enable(false); } else { activation.requestEnable(); if (disclosed.current) enable(); else setConsent(true); } },
    goal: (result) => { if (voice.st.enabled) voice.listenGoal(result); else { activation.requestGoal(result); if (disclosed.current) enable(); else setConsent(true); } },
    answer: () => voice.listenAnswer(),
    cancelInput: () => { activation.cancel(); setConsent(false); voice.cancelInput(); },
    toggleArs: () => {
      const s = sessionRef.current;
      if (audio.enabled) {
        if (s) autoPlayedSession.current = s.sessionId;
        player.stop();
      } else if (s && visible.current && isActive(latest.current) && latest.current.snapshot.status !== "connected_to_agent") {
        autoPlayedSession.current = s.sessionId;
        player.start(s);
      }
    },
  };
  const dialog = consent && html`<${Dialog} title="Agent와 음성으로 대화할까요?" onDismiss=${() => { setConsent(false); activation.cancel(); }}
    dismiss=${html`<${TextButton} onClick=${() => { setConsent(false); activation.cancel(); }}>취소<//>`}
    confirm=${html`<${TextButton} onClick=${() => { setConsent(false); disclosed.current = true; enable(); }}>허용하고 켜기<//>`}>
    <div>마이크 음성을 글자로 바꿔 Agent에게 전달해요. 기기의 음성 인식 서비스에 따라 음성이 외부 서버로 전송될 수 있어요. 기관이나 상담원에게 내 목소리를 보내지 않아요. 개인정보와 중요한 선택은 화면에서 입력해 주세요.</div>
  <//>`;
  return { ui, dialog };
}

/* ------------------------------------------------------------------ 최상위 */
function MainPhoneApp({ phoneState, onPhoneAction, voice, audio }) {
  const entry = useStore(owner.entry);
  const server = useStore(owner.server.store);
  const [real, setReal] = useState(true);
  const [modes, setModes] = useState(false);
  let body;
  if (entry != null) {
    body = server.hasSession || server.starting || server.creationUncertain
      ? html`<${LiveSessionScreen} key=${"s" + entry.generation} entry=${entry} server=${server} voice=${voice} audio=${audio}
          onReturn=${() => { if (owner.returnAfterEnd() || owner.returnAfterUnavailable()) onPhoneAction({ type: "Tab", tab: "Keypad" }); }}/>`
      : html`<${LivePurposeScreen} key=${"p" + entry.generation} entry=${entry} server=${server} voice=${voice}/>`;
  } else {
    body = html`<${ArsApp} state=${phoneState} onAction=${(a) => { if (real && a.type === "StartAgent") owner.begin(phoneState.number); else onPhoneAction(a); }}
      modeLabel=${real ? "실제 ARS" : "UI 데모 · " + scenarioTitle(phoneState.scenario)} onModeMenu=${() => setModes(true)}/>`;
  }
  return html`${body}${modes && entry == null && html`<${Dialog} title="ARS 사용 모드" onDismiss=${() => setModes(false)} confirm=${html`<${TextButton} onClick=${() => setModes(false)}>닫기<//>`}>
    <div>일반 전화·연락처·통화 기록은 예시 화면이에요.</div>
    <${PresenceBadge}/>
    <div class="col">
      <${TextButton} onClick=${() => { setReal(true); setModes(false); }}>실제 ARS<//>
      <${TextButton} onClick=${() => { setReal(false); setModes(false); }}>UI 데모<//>
      ${SCENARIOS.map(([k, title]) => html`<${TextButton} onClick=${() => { setReal(false); onPhoneAction({ type: "Scenario", scenario: k }); setModes(false); }}>${title}<//>`)}
    </div><//>`}`;
}
/** 'ARS 사용 모드' 창 안에 이 서버의 진행 중 통화 수 표시 ('접속 중 N명', 창이 열려 있는 동안 10초 간격, 탭이 보일 때만 확인).
 *  기본 화면·통화 화면에는 표시하지 않음 (운영 정보 노출 방지).
 *  2명 이상이면 판단·받아쓰기 모델을 나눠 쓰는 상태이므로 빨간색 표시. 이 값을 주지 않는 서버면 표시 없음. */
function PresenceBadge() {
  const [count, setCount] = useState(null);
  useEffect(() => {
    let live = true;
    const tick = async () => {
      if (document.visibilityState !== "visible") return;
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 8000);
      try {
        const r = await fetch(SERVER_TEST_URL + "/health", { cache: "no-store", credentials: "omit", redirect: "manual", signal: ctl.signal });
        if (r.status !== 200) return;
        const body = await r.text();
        if (body.length > MAX_API_BYTES) return;
        const h = parseJson(body, dHealth);
        if (live) setCount(h.activeSessions);
      } catch {} finally { clearTimeout(timer); }
    };
    tick();
    const every = setInterval(tick, 10000);
    const onVisible = () => { if (document.visibilityState === "visible") tick(); };
    document.addEventListener("visibilitychange", onVisible);
    return () => { live = false; clearInterval(every); document.removeEventListener("visibilitychange", onVisible); };
  }, []);
  if (count == null) return null;
  return html`<div class=${"presence" + (count >= 2 ? " multi" : "")} data-testid="presence" title="이 서버에서 진행 중인 통화 수 (10초마다 갱신)">접속 중 ${count}명</div>`;
}
/** Browser-only reading preference. This hook never changes a call or its draft inputs. */
function useTextSizePreference() {
  const [largeText, setLargeText] = useState(() => Prefs.get("largeText") === "1");
  const toggle = () => setLargeText(current => {
    const next = !current;
    Prefs.set("largeText", next ? "1" : null);
    return next;
  });
  return { largeText, toggle };
}
function TextSizeControl({ largeText, onToggle }) {
  return html`<button type="button" class="text-size-toggle" aria-pressed=${largeText} onClick=${onToggle}>
    ${largeText ? "기본 글씨로" : "큰글씨 보기"}
  </button>`;
}
/** 판단 모델 설정: 앱 화면이 나오기 전에 API 키와 판단 조합(판단 모델·STT 후보정·결과 안내 판단)을 정함. 고른 값은 이 브라우저에 저장되어
 *  발신 때 그대로 사용 (발신 확인 창에서는 고르지 않음). 서버가 조합을 알려 주지 않으면(조합 정보가 없는 서버·조회 실패) 바로 앱 화면으로 이동. */
function ModelSetup({ onDone }) {
  const [combos, setCombos] = useState(null);
  const [combo, setCombo] = useState(null);
  const [key, setKey] = useState(() => Prefs.appKey ?? "");
  const [record, setRecord] = useState(() => Prefs.record);
  const [stored, setStored] = useState(() => !isBlank(Prefs.appKey));
  const [anon, setAnon] = useState(() => Prefs.get("anonymous") === "1");
  useEffect(() => {
    let live = true;
    (async () => {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 10000);
      let h = null;
      try {
        const r = await fetch(SERVER_TEST_URL + "/health", { cache: "no-store", credentials: "omit", redirect: "manual", signal: ctl.signal });
        if (r.status === 200) {
          const body = await r.text();
          if (body.length <= MAX_API_BYTES) h = parseJson(body, dHealth);
        }
      } catch {} finally { clearTimeout(timer); }
      if (!live) return;
      if (!h || !h.combos) { onDone(); return; }
      // 저장된 선택이 이 서버에 없는 값이면 서버 기본값 (발신 확인 창과 같은 처리)
      const c = Prefs.combo;
      const ok = c && h.combos.interp.some((x) => x.id === c.interp) && h.combos.fix.some((x) => x.id === c.fix);
      let base = ok ? c : { ...h.combos.default };
      if (h.combos.result && !h.combos.result.some((x) => x.id === base.result))
        base = { ...base, result: h.combos.default.result ?? h.combos.result[0]?.id };
      setCombos(h.combos);
      setCombo(base);
    })();
    return () => { live = false; };
  }, []);
  // 키는 형식이 맞을 때만 저장 (비워 두면 발신 확인 창에서 입력받음)
  const go = () => { if (combo) Prefs.combo = combo; Prefs.record = record; Prefs.set("anonymous", anon ? "1" : null); if (!isBlank(key) && asciiPrintable(key)) Prefs.appKey = key; onDone(); };
  if (!combos || !combo) return html`<div class="t-bodym sec" style=${{ padding: "24px" }}>설정을 불러오고 있어요.</div>`;
  return html`<${Dialog} title="판단 모델 설정" onDismiss=${go}
    confirm=${html`<button class="tbtn" data-testid="setup-start" onClick=${go}>시작</button>`}>
    <div class="field"><label>API 키</label><input type="password" data-testid="setup-key" autocomplete="off" autocapitalize="off" spellcheck="false" value=${key}
      onInput=${(e) => setKey(e.target.value.slice(0, 1024))} onKeyDown=${(e) => { if (e.key === "Enter") go(); }}/></div>
    <div class="row" style=${{ alignItems: "center", gap: "4px", flexWrap: "wrap" }}>
      <span class="t-bodym">${stored ? "이 브라우저에 저장된 키를 써요." : "키는 이 브라우저에만 저장해 다음에 다시 써요."}</span>
      ${stored && html`<${TextButton} onClick=${() => { Prefs.appKey = null; setStored(false); setKey(""); }}>저장된 키 지우기<//>`}
    </div>
    <label class="row" style=${{ gap: "8px", alignItems: "flex-start", cursor: "pointer" }}>
      <input type="checkbox" data-testid="setup-record" checked=${record} onChange=${(e) => setRecord(e.target.checked)} style=${{ marginTop: "3px" }}/>
      <span class="t-bodym">통화 기록 남기기 (시험용)<br/>통화 소리와 인식 문장·누른 번호 시각을 통화가 끝난 뒤 내려받을 수 있어요. 서버 PC의 recordings 폴더에도 저장되며 직접 지울 때까지 남아요. 직접 입력한 번호의 값은 남기지 않지만, ARS가 읽어 주는 개인정보는 녹음에 남아요.</span>
    </label>
    <label class="row" style=${{ gap: "8px", alignItems: "flex-start", cursor: "pointer" }}>
      <input type="checkbox" data-testid="setup-anon" checked=${anon} onChange=${(e) => setAnon(e.target.checked)} style=${{ marginTop: "3px" }}/>
      <span class="t-bodym">익명 모드 (시연용)<br/>키패드를 누를 때 눌린 표시가 나타나지 않아, 화면에서 어떤 번호를 눌렀는지 알 수 없어요.</span>
    </label>
    ${combos && combo && html`
      <div class="field"><label>판단 모델</label>
        <select data-testid="live-combo-interp" value=${combo.interp} onChange=${(e) => setCombo({ ...combo, interp: e.target.value })}>
          ${combos.interp.map((x) => html`<option value=${x.id}>${x.label}</option>`)}
        </select></div>
      <div class="field"><label>STT 후보정</label>
        <select data-testid="live-combo-fix" value=${combo.fix} onChange=${(e) => setCombo({ ...combo, fix: e.target.value })}>
          ${combos.fix.map((x) => html`<option value=${x.id}>${x.label}</option>`)}
        </select></div>
      ${combos.result && combo.interp === "hybrid" && html`
      <div class="field"><label>결과 안내 판단</label>
        <select data-testid="live-combo-result" value=${combo.result} onChange=${(e) => setCombo({ ...combo, result: e.target.value })}>
          ${combos.result.map((x) => html`<option value=${x.id}>${x.label}</option>`)}
        </select></div>`}
      <span class="t-bodym sec">STT 는 로컬 Whisper 로 고정이에요. 1단계는 판단할 때 함께 고치고(JEV 쪽은 로컬로 판단한 안내만), 2단계는 판단 뒤 따로 고쳐 화면에만 써요.${combos.result && combo.interp === "hybrid" ? " 결과 안내 판단은 '발송됩니다'처럼 결과를 알리는 말이 든 안내를 누가 판단할지예요. JEV 를 골라도 개인정보가 보이면 로컬이 판단해요." : ""}</span>`}
  <//>`;
}
function Root() {
  const { largeText, toggle } = useTextSizePreference();
  const [ready, setReady] = useState(false);   // 판단 모델 설정(ModelSetup) 완료 여부
  const phone = useStore(phoneModel.store);
  const entry = useStore(owner.entry);
  const server = useStore(owner.server.store);
  const hasCallView = entry != null || ["Purpose", "Call", "Ended"].includes(phone.screen);
  // 흰 화면(기본 키패드·상세)이면 상단 막대도 흰색, 그 밖에는 화면과 같은 그라데이션 (ArsApp 의 home 과 같은 기준)
  const whiteTop = ready && entry == null && ["Home", "Detail"].includes(phone.screen);
  return html`<${TextSizeContext.Provider} value=${largeText}><div class=${"app" + (largeText ? " large-text" : "") + (whiteTop ? " white-top" : "") + (ready && Prefs.get("anonymous") === "1" ? " anon" : "")}>
    <header class="app-toolbar" aria-label="보기 설정">
      <div class="toolbar-info">
        ${largeText && hasCallView && (entry != null || phone.agent) && html`<span class="toolbar-mode" aria-label=${entry != null ? "실제 ARS" : "UI 데모 · 실제 통화 아님"}>${entry != null ? "실제 ARS" : "UI 데모"}</span>`}
      </div>
      <${TextSizeControl} largeText=${largeText} onToggle=${toggle}/>
    </header>
    <div class="app-viewport">
    ${ready ? html`<${MainLiveBindings} entry=${entry} state=${server}>${(voice, audio) => html`<${MainPhoneApp} phoneState=${phone} onPhoneAction=${phoneModel.dispatch} voice=${voice} audio=${audio}/>`}<//>`
      : html`<${ModelSetup} onDone=${() => setReady(true)}/>`}
    </div>
  </div><//>`;
}
render(html`<${Root}/>`, document.getElementById("root"));
</script>
</body>
</html>
